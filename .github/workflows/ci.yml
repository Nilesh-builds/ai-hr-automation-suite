name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Static checks (workflow JSON + credential hygiene)
        run: python scripts/static_checks.py

      - name: Run tests
        run: pytest -q

      - name: Run rule-baseline evaluation
        run: python -m aihr.eval.runner

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: data/reports/eval_report.json